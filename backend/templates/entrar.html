<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entrar · Painel de Despesas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --line:#DCE1E7; --ink:#16202B; --ink-2:#465260;
  --accent:#1D5FB0; --accent-ink:#FFFFFF; --bad:#B42318;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#11161C; --surface:#18202A; --line:#2C3743; --ink:#EDF1F5; --ink-2:#BAC4CF;
         --accent:#6EA8F0; --accent-ink:#0C1A2B; --bad:#FF8A80; color-scheme:dark; }
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;
  background:var(--bg);color:var(--ink);font:15px/1.55 'Instrument Sans',system-ui,sans-serif}
.card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px 24px;display:flex;flex-direction:column;gap:16px}
h1{margin:0;font:700 26px/1.15 'Bricolage Grotesque',system-ui,sans-serif;letter-spacing:-.01em}
p{margin:0;color:var(--ink-2)}
label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
input{min-height:46px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{min-height:46px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);font:600 15px inherit;font-family:inherit;cursor:pointer}
.erro{color:var(--bad);font-weight:500}
</style>
</head>
<body>
<main class="card">
  <h1>Entrar</h1>
  <p>Use o e-mail e a senha da sua conta para abrir o painel.</p>
  <form method="post" style="display:flex;flex-direction:column;gap:14px">
    <label>E-mail <input type="email" name="email" value="{{ email }}" autocomplete="username" required autofocus></label>
    <label>Senha <input type="password" name="senha" autocomplete="current-password" required></label>
    {% if erro %}<p class="erro" role="alert">{{ erro }}</p>{% endif %}
    <button type="submit">Entrar</button>
  </form>
</main>
</body>
</html>
